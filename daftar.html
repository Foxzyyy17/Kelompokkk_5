<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAFTAR EDUKA</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="halaman-daftar">
    <div class="container">
      <div class="form-box">
        <h1>Daftar EDUKA</h1>
        <p>Buat akun untuk memulai belajar online</p>
        <form>
          <div class="input-box">
            <label>Nama Lengkap</label>
            <input type="text" placeholder="Masukan nama lengkap" required />
          </div>
          <div class="input-box">
            <label>Username</label>
            <input type="text" placeholder="Masukkan username" required />
          </div>
          <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Masukkan email" required />
          </div>
          <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Masukkan password" required />
          </div>
          <div class="input-box">
            <label>Konfirmasi Password</label>
            <input type="password" placeholder="Ulangi password" required />
          </div>
          <div class="input-box">
            <label>Jenis Kelamin</label>
            <div class="radio-group">
              <label> <input type="radio" name="jk" /> Laki-laki</label>
              <label> <input type="radio" name="jk" /> Perempuan</label>
            </div>
          </div>
          <div class="input-box">
            <label>Pilih kelas</label>
            <select required>
              <option value="">--Pilih kelas--</option>
              <option>Kelas Matematika</option>
              <option>Kelas Sains</option>
            </select>
          </div>
          <div class="checkbox">
            <input type="checkbox" required />
            <span>Saya setuju dengan syarat dan ketentuan</span>
          </div>
          <button type="submit" class="btn-daftar">DAFTAR SEKARANG</button>
        </form>
      </div>
    </div>
  </body>
</html>
